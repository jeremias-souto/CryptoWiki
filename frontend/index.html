<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoWiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="title">CryptoWiki</h1>
    <h5 class="subtitle">A website that provides information about cryptocurrencies</h5>

    <p class="options-p">Select a crypto</p>
    <select name="options" class="options-select">
        <option value="1">Bitcoin</option>
        <option value="2">Ethereum</option>
        <option value="3">USDT</option>
        <option value="4">Litecoin</option>

    <button class="button">Get Information</button>

    <span class="information">-</span>

    <p class="footer">Created by Jeremias Souto with ❤️ for the community!</p>

    <script src="script.js"></script>
